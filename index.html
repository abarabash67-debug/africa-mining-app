<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Africa Mining Dashboard</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* ===== СВЕТОФОР ===== */
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .status-green { background: #22c55e; }
        .status-yellow { background: #eab308; }
        .status-red { background: #ef4444; }
        .status-gray { background: #9ca3af; }

        /* ===== КАРТОЧКИ ===== */
        .dashboard {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--tg-theme-hint-color, #e5e7eb);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #6b7280);
        }

        .header .role-badge {
            display: inline-block;
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .alert-banner {
            background: var(--tg-theme-secondary-bg-color, #f3f4f6);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #ef4444;
        }

        .alert-banner h3 {
            font-size: 14px;
            color: #ef4444;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-banner .alert-item {
            font-size: 13px;
            padding: 4px 0;
            color: var(--tg-theme-text-color, #000000);
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f9fafb);
            border-radius: 12px;
            padding: 16px;
            transition: transform 0.15s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
        }

        .card-mine-name {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #6b7280);
        }

        .card-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #6b7280);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--tg-theme-hint-color, #e5e7eb);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .progress-green { background: #22c55e; }
        .progress-yellow { background: #eab308; }
        .progress-red { background: #ef4444; }

        /* ===== КНОПКИ ДЕЙСТВИЙ ===== */
        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 2px solid var(--tg-theme-hint-color, #e5e7eb);
        }

        .action-btn {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:active {
            opacity: 0.7;
        }

        .action-btn.secondary {
            background: var(--tg-theme-secondary-bg-color, #e5e7eb);
            color: var(--tg-theme-text-color, #000000);
        }

        .action-btn .icon {
            font-size: 18px;
        }

        /* ===== ЗАГРУЗКА ===== */
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--tg-theme-hint-color, #6b7280);
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 4px solid var(--tg-theme-hint-color, #e5e7eb);
            border-top-color: var(--tg-theme-button-color, #0088cc);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== АДАПТИВ ===== */
        @media (min-width: 480px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .card-full {
                grid-column: 1 / -1;
            }
        }

        @media (min-width: 640px) {
            body { padding: 24px; }
            .header h1 { font-size: 28px; }
        }

        /* ===== ТЕМНАЯ ТЕМА ===== */
        @media (prefers-color-scheme: dark) {
            body {
                background: var(--tg-theme-bg-color, #1a1a2e);
                color: var(--tg-theme-text-color, #ffffff);
            }
        }

        /* ===== ПЕЧАТЬ PDF ===== */
        @media print {
            .action-bar { display: none; }
            .card:active { transform: none; }
            body { background: #ffffff !important; color: #000000 !important; }
            .card { background: #f9fafb !important; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="dashboard" id="app">
    <!-- Загрузка -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Загрузка данных...</p>
    </div>

    <!-- Контент -->
    <div id="content" class="hidden">
        <!-- Шапка -->
        <div class="header">
            <h1>⛏️ Africa Mining</h1>
            <div class="subtitle" id="userInfo">Загрузка...</div>
            <div class="role-badge" id="roleBadge">—</div>
        </div>

        <!-- Баннер алертов -->
        <div id="alertBanner" class="alert-banner hidden">
            <h3>🚨 КРИТИЧЕСКИЕ АЛЕРТЫ</h3>
            <div id="alertList"></div>
        </div>

        <!-- Дашборд -->
        <div id="dashboardContent"></div>

        <!-- Кнопки действий -->
        <div class="action-bar">
            <button class="action-btn" id="callBtn">
                <span class="icon">📞</span> Позвонить
            </button>
            <button class="action-btn secondary" id="pdfBtn">
                <span class="icon">📄</span> PDF-брифинг
            </button>
        </div>
    </div>
</div>

<script>
    // ================================================================
    // 1. КОНФИГУРАЦИЯ (синхронизировано с config.py)
    // ================================================================
    const ROLES_CONFIG = {
        // Роли и их видимость
        CEO: {
            label: 'CEO',
            view: 'all_africa',
            phones: {
                'Конго': '+243XXXXXXXXX',
                'Танзания': '+255XXXXXXXXX',
                'Мозамбик': '+258XXXXXXXXX'
            }
        },
        MINE_MANAGER: {
            label: 'MINE_MANAGER',
            view: 'country_only', // показываем только свою страну
            phones: {} // заполняется из данных
        },
        ASSISTANT: {
            label: 'ASSISTANT',
            view: 'all_africa_no_finance',
            phones: {}
        }
    };

    // Фейковые данные (синхронизированы с data.py)
    const MINING_DATA = {
        'Конго': {
            mines: [
                { name: 'Конго-1', ore: 'Медь', plan: 5000, actual: 4800, percent: 96, status: 'green', issues: [] },
                { name: 'Конго-2', ore: 'Медь', plan: 4500, actual: 3200, percent: 71, status: 'yellow', issues: ['Сбой конвейера'] },
                { name: 'Конго-3', ore: 'Кобальт', plan: 3000, actual: 1500, percent: 50, status: 'red', issues: ['Ремонт дробилки', 'Нехватка персонала'] }
            ],
            phone: '+243XXXXXXXXX'
        },
        'Танзания': {
            mines: [
                { name: 'Танзания-1', ore: 'Золото', plan: 2000, actual: 1900, percent: 95, status: 'green', issues: [] },
                { name: 'Танзания-2', ore: 'Золото', plan: 1800, actual: 1200, percent: 67, status: 'yellow', issues: ['Задержка поставок'] },
                { name: 'Танзания-3', ore: 'Золото', plan: 1500, actual: 900, percent: 60, status: 'red', issues: ['Проблемы с вентиляцией'] }
            ],
            phone: '+255XXXXXXXXX'
        },
        'Мозамбик': {
            mines: [
                { name: 'Мозамбик-1', ore: 'Уголь', plan: 3000, actual: 2900, percent: 97, status: 'green', issues: [] },
                { name: 'Мозамбик-2', ore: 'Уголь', plan: 2500, actual: 1800, percent: 72, status: 'yellow', issues: ['Перегрузка'] },
                { name: 'Мозамбик-3', ore: 'Уголь', plan: 2000, actual: 800, percent: 40, status: 'red', issues: ['Авария на шахте', 'Остановка производства'] }
            ],
            phone: '+258XXXXXXXXX'
        }
    };

    // Роли и их привязка к странам (синхронизировано с WHITE_LIST)
    const USER_ROLES = {
        // Пример: "123456789": { role: "CEO", region: "all_africa" }
        // ВАЖНО: в реальном проекте это получается из Telegram WebApp + вашего config.py
    };

    // ================================================================
    // 2. ОСНОВНАЯ ЛОГИКА
    // ================================================================

    let currentUser = null;
    let userRoleData = null;

    function init() {
        const tg = window.Telegram?.WebApp;
        
        if (!tg) {
            document.getElementById('loading').innerHTML = '<p>❌ Ошибка: Telegram WebApp не найден</p>';
            return;
        }

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (!user) {
            document.getElementById('loading').innerHTML = '<p>❌ Пожалуйста, откройте через Telegram</p>';
            return;
        }

        currentUser = user;
        tg.ready(); // Сообщаем Telegram, что приложение готово

        // Определяем роль пользователя
        const userId = String(user.id);
        const roleConfig = USER_ROLES[userId] || { role: 'MINE_MANAGER', region: 'Конго' };
        userRoleData = roleConfig;

        // Скрываем загрузку, показываем контент
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');

        // Рендерим дашборд
        renderDashboard(user, roleConfig);
    }

    function renderDashboard(user, roleConfig) {
        const role = roleConfig.role;
        const region = roleConfig.region;

        // Обновляем шапку
        document.getElementById('userInfo').textContent = `${user.first_name || 'User'} ${user.last_name || ''}`.trim() || user.username || 'Пользователь';
        document.getElementById('roleBadge').textContent = ROLES_CONFIG[role]?.label || role;

        // Определяем, что показывать
        let countriesToShow = [];
        let showFinance = false;

        if (role === 'CEO') {
            countriesToShow = Object.keys(MINING_DATA);
            showFinance = true;
        } else if (role === 'ASSISTANT') {
            countriesToShow = Object.keys(MINING_DATA);
            showFinance = false;
        } else if (role === 'MINE_MANAGER') {
            // Показываем только свою страну
            const userCountry = region || 'Конго';
            if (MINING_DATA[userCountry]) {
                countriesToShow = [userCountry];
            } else {
                countriesToShow = ['Конго']; // fallback
            }
            showFinance = false;
        } else {
            // fallback
            countriesToShow = ['Конго'];
        }

        // Собираем все алерты
        const allAlerts = [];
        const alertBanner = document.getElementById('alertBanner');
        const alertList = document.getElementById('alertList');

        countriesToShow.forEach(country => {
            const countryData = MINING_DATA[country];
            if (!countryData) return;
            countryData.mines.forEach(mine => {
                if (mine.issues && mine.issues.length > 0) {
                    mine.issues.forEach(issue => {
                        allAlerts.push({
                            country,
                            mine: mine.name,
                            issue,
                            status: mine.status
                        });
                    });
                }
            });
        });

        // Сортируем: сначала критические (red), потом желтые
        allAlerts.sort((a, b) => {
            const priority = { red: 0, yellow: 1, green: 2 };
            return (priority[a.status] || 3) - (priority[b.status] || 3);
        });

        // Показываем баннер, если есть алерты
        if (allAlerts.length > 0) {
            alertBanner.classList.remove('hidden');
            alertList.innerHTML = allAlerts.slice(0, 5).map(alert =>
                `<div class="alert-item">
                    <span class="status-dot status-${alert.status}"></span>
                    <strong>${alert.country}</strong> — ${alert.mine}: ${alert.issue}
                </div>`
            ).join('');
            if (allAlerts.length > 5) {
                alertList.innerHTML += `<div class="alert-item" style="color: var(--tg-theme-hint-color);">...и еще ${allAlerts.length - 5}</div>`;
            }
        } else {
            alertBanner.classList.add('hidden');
        }

        // Рендерим карточки
        const container = document.getElementById('dashboardContent');
        let html = '';

        countriesToShow.forEach(country => {
            const countryData = MINING_DATA[country];
            if (!countryData) return;

            const totalPlan = countryData.mines.reduce((sum, m) => sum + m.plan, 0);
            const totalActual = countryData.mines.reduce((sum, m) => sum + m.actual, 0);
            const totalPercent = totalPlan > 0 ? Math.round((totalActual / totalPlan) * 100) : 0;
            const statusColor = totalPercent >= 90 ? 'green' : totalPercent >= 70 ? 'yellow' : 'red';

            html += `
                <div class="section">
                    <div class="section-title">
                        <span>🇨🇩 ${country}</span>
                        <span style="font-size: 13px; color: var(--tg-theme-hint-color);">
                            ${countryData.mines.length} рудников
                        </span>
                    </div>
                    <div class="grid">
                        <div class="card card-full">
                            <div class="card-header">
                                <span class="card-title">📊 Итого по стране</span>
                                <span class="status-dot status-${statusColor}"></span>
                            </div>
                            <div class="card-stats">
                                <div class="stat-item">
                                    <div class="stat-value">${totalPlan.toLocaleString()}</div>
                                    <div class="stat-label">План (т/сут)</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${totalActual.toLocaleString()}</div>
                                    <div class="stat-label">Факт (т/сут)</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${totalPercent}%</div>
                                    <div class="stat-label">Выполнение</div>
                                </div>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill progress-${statusColor}" style="width: ${Math.min(totalPercent, 100)}%"></div>
                            </div>
                            ${showFinance ? `<div style="margin-top: 8px; font-size: 13px; color: var(--tg-theme-hint-color);">💰 Средняя цена: $${(Math.random() * 10000 + 5000).toFixed(0)}/т</div>` : ''}
                        </div>
                    </div>
                    <div class="grid" style="margin-top: 8px;">
                        ${countryData.mines.map(mine => {
                            const statusDot = mine.status || (mine.percent >= 90 ? 'green' : mine.percent >= 70 ? 'yellow' : 'red');
                            return `
                                <div class="card">
                                    <div class="card-header">
                                        <span class="card-title">${mine.name}</span>
                                        <span class="status-dot status-${statusDot}"></span>
                                    </div>
                                    <div class="card-mine-name">${mine.ore}</div>
                                    <div class="card-stats">
                                        <div class="stat-item">
                                            <div class="stat-value">${mine.plan.toLocaleString()}</div>
                                            <div class="stat-label">План</div>
                                        </div>
                                        <div class="stat-item">
                                            <div class="stat-value">${mine.actual.toLocaleString()}</div>
                                            <div class="stat-label">Факт</div>
                                        </div>
                                        <div class="stat-item">
                                            <div class="stat-value">${mine.percent}%</div>
                                            <div class="stat-label">Вып.</div>
                                        </div>
                                    </div>
                                    <div class="progress-bar">
                                        <div class="progress-fill progress-${statusDot}" style="width: ${Math.min(mine.percent, 100)}%"></div>
                                    </div>
                                    ${mine.issues && mine.issues.length > 0 ? `<div style="margin-top: 6px; font-size: 11px; color: #ef4444;">⚠️ ${mine.issues.join(', ')}</div>` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;

        // Настраиваем кнопки действий
        setupActionButtons(roleConfig);
    }

    function setupActionButtons(roleConfig) {
        const role = roleConfig.role;
        const region = roleConfig.region;

        // Кнопка звонка
        const callBtn = document.getElementById('callBtn');
        let phoneNumber = null;

        if (role === 'CEO') {
            // CEO звонит директорам стран (показываем выбор)
            callBtn.textContent = '📞 Связаться с директором';
            callBtn.onclick = () => {
                const countries = Object.keys(MINING_DATA);
                // В реальном проекте здесь будет выбор или прямой звонок
                // Для демо - звоним в первую страну
                const firstCountry = countries[0];
                const phone = MINING_DATA[firstCountry]?.phone;
                if (phone) {
                    window.location.href = `tel:${phone}`;
                } else {
                    alert('Телефон не найден');
                }
            };
        } else if (role === 'MINE_MANAGER') {
            const userCountry = region || 'Конго';
            const phone = MINING_DATA[userCountry]?.phone;
            if (phone) {
                phoneNumber = phone;
                callBtn.textContent = `📞 Позвонить диспетчеру (${userCountry})`;
                callBtn.onclick = () => {
                    window.location.href = `tel:${phoneNumber}`;
                };
            } else {
                callBtn.style.opacity = '0.5';
                callBtn.textContent = '📞 Телефон не найден';
                callBtn.onclick = () => alert('Телефон для этой страны не настроен');
            }
        } else {
            callBtn.textContent = '📞 Контакты';
            callBtn.onclick = () => {
                alert('Для получения контактов обратитесь к CEO');
            };
        }

        // Кнопка PDF
        document.getElementById('pdfBtn').onclick = () => {
            window.print();
        };
    }

    // ================================================================
    // 3. ЗАПУСК
    // ================================================================

    // Ждем загрузки Telegram WebApp
    if (window.Telegram?.WebApp) {
        init();
    } else {
        document.addEventListener('DOMContentLoaded', () => {
            if (window.Telegram?.WebApp) {
                init();
            } else {
                document.getElementById('loading').innerHTML = '<p>⏳ Загрузка Telegram WebApp...</p>';
                // Повторная попытка через 1 секунду
                setTimeout(() => {
                    if (window.Telegram?.WebApp) {
                        init();
                    } else {
                        document.getElementById('loading').innerHTML = '<p>❌ Не удалось загрузить Telegram WebApp. Проверьте подключение к интернету.</p>';
                    }
                }, 1000);
            }
        });
    }
</script>
</body>
</html>
