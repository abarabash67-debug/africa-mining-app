<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Africa Mining Dashboard</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .dashboard {
            max-width: 600px;
            margin: 0 auto;
        }

        /* ===== ПАНЕЛЬ ПЕРЕКЛЮЧЕНИЯ РОЛЕЙ ===== */
        .role-panel {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            padding: 12px;
            background: var(--tg-theme-secondary-bg-color, #f3f4f6);
            border-radius: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .role-btn {
            padding: 8px 20px;
            border: 2px solid transparent;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            opacity: 0.6;
        }

        .role-btn:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }

        .role-btn.active {
            opacity: 1;
            border-color: var(--tg-theme-button-color, #0088cc);
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .role-btn.ceo.active {
            border-color: #22c55e;
            background: #22c55e;
            color: #ffffff;
        }

        .role-btn.mechanic.active {
            border-color: #eab308;
            background: #eab308;
            color: #ffffff;
        }

        .role-btn.supply.active {
            border-color: #3b82f6;
            background: #3b82f6;
            color: #ffffff;
        }

        .role-label {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #6b7280);
            text-align: center;
            width: 100%;
            margin-bottom: 4px;
        }

        /* ===== ОСТАЛЬНЫЕ СТИЛИ ===== */
        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .status-green { background: #22c55e; }
        .status-yellow { background: #eab308; }
        .status-red { background: #ef4444; }
        .status-gray { background: #9ca3af; }

        .header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--tg-theme-hint-color, #e5e7eb);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #6b7280);
        }

        .header .role-badge {
            display: inline-block;
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .alert-banner {
            background: var(--tg-theme-secondary-bg-color, #f3f4f6);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border-left: 4px solid #ef4444;
        }

        .alert-banner h3 {
            font-size: 14px;
            color: #ef4444;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .alert-banner .alert-item {
            font-size: 13px;
            padding: 4px 0;
            color: var(--tg-theme-text-color, #000000);
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f9fafb);
            border-radius: 12px;
            padding: 16px;
            transition: transform 0.15s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
        }

        .card-mine-name {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #6b7280);
        }

        .card-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 11px;
            color: var(--tg-theme-hint-color, #6b7280);
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--tg-theme-hint-color, #e5e7eb);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .progress-green { background: #22c55e; }
        .progress-yellow { background: #eab308; }
        .progress-red { background: #ef4444; }

        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 2px solid var(--tg-theme-hint-color, #e5e7eb);
        }

        .action-btn {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:active {
            opacity: 0.7;
        }

        .action-btn.secondary {
            background: var(--tg-theme-secondary-bg-color, #e5e7eb);
            color: var(--tg-theme-text-color, #000000);
        }

        .action-btn.danger {
            background: #ef4444;
            color: #ffffff;
        }

        .action-btn .icon {
            font-size: 18px;
        }

        .hidden {
            display: none !important;
        }

        /* Блок для механика */
        .emergency-btn {
            width: 100%;
            padding: 16px;
            background: #ef4444;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            animation: pulse 2s infinite;
            margin-top: 12px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .warehouse-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--tg-theme-hint-color, #e5e7eb);
        }

        .warehouse-item:last-child {
            border-bottom: none;
        }

        .warehouse-name {
            font-weight: 500;
        }

        .warehouse-value {
            font-weight: 600;
            color: var(--tg-theme-button-color, #0088cc);
        }

        .warehouse-value.low {
            color: #ef4444;
        }

        @media (min-width: 480px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .card-full {
                grid-column: 1 / -1;
            }
        }

        @media (min-width: 640px) {
            body { padding: 24px; }
            .header h1 { font-size: 28px; }
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: var(--tg-theme-bg-color, #1a1a2e);
                color: var(--tg-theme-text-color, #ffffff);
            }
        }

        @media print {
            .action-bar { display: none; }
            .role-panel { display: none; }
            .card:active { transform: none; }
            body { background: #ffffff !important; color: #000000 !important; }
            .card { background: #f9fafb !important; }
        }
    </style>
</head>
<body>

<div class="dashboard" id="app">
    <!-- ===== ПАНЕЛЬ ПЕРЕКЛЮЧЕНИЯ РОЛЕЙ ===== -->
    <div class="role-panel">
        <div class="role-label">👤 Режим:</div>
        <button class="role-btn ceo active" data-role="ceo" onclick="switchRole('ceo')">
            👑 CEO
        </button>
        <button class="role-btn mechanic" data-role="mechanic" onclick="switchRole('mechanic')">
            🔧 Механик
        </button>
        <button class="role-btn supply" data-role="supply" onclick="switchRole('supply')">
            📦 Снабжение
        </button>
    </div>

    <!-- Шапка -->
    <div class="header">
        <h1>⛏️ Africa Mining</h1>
        <div class="subtitle">Демонстрационная версия</div>
        <div class="role-badge" id="roleBadge">CEO</div>
    </div>

    <!-- Баннер алертов (только для CEO) -->
    <div id="alertBanner" class="alert-banner">
        <h3>🚨 КРИТИЧЕСКИЕ АЛЕРТЫ</h3>
        <div id="alertList">
            <div class="alert-item">
                <span class="status-dot status-red"></span>
                <strong>Конго</strong> — Конго-3: Ремонт дробилки
            </div>
            <div class="alert-item">
                <span class="status-dot status-red"></span>
                <strong>Мозамбик</strong> — Мозамбик-3: Авария на шахте
            </div>
            <div class="alert-item">
                <span class="status-dot status-yellow"></span>
                <strong>Конго</strong> — Конго-2: Сбой конвейера
            </div>
        </div>
    </div>

    <!-- ===== КОНТЕНТ ===== -->
    <div id="dashboardContent"></div>

    <!-- ===== КНОПКИ ДЕЙСТВИЙ ===== -->
    <div class="action-bar">
        <button class="action-btn" id="callBtn">
            <span class="icon">📞</span> Позвонить
        </button>
        <button class="action-btn secondary" id="pdfBtn">
            <span class="icon">📄</span> PDF-брифинг
        </button>
    </div>
</div>

<script>
    // ================================================================
    // 1. ДАННЫЕ
    // ================================================================

    const MINING_DATA = {
        'Конго': {
            mines: [
                { name: 'Конго-1', ore: 'Медь', plan: 5000, actual: 4800, percent: 96, status: 'green', issues: [] },
                { name: 'Конго-2', ore: 'Медь', plan: 4500, actual: 3200, percent: 71, status: 'yellow', issues: ['Сбой конвейера'] },
                { name: 'Конго-3', ore: 'Кобальт', plan: 3000, actual: 1500, percent: 50, status: 'red', issues: ['Ремонт дробилки', 'Нехватка персонала'] }
            ],
            phone: '+243XXXXXXXXX'
        },
        'Танзания': {
            mines: [
                { name: 'Танзания-1', ore: 'Золото', plan: 2000, actual: 1900, percent: 95, status: 'green', issues: [] },
                { name: 'Танзания-2', ore: 'Золото', plan: 1800, actual: 1200, percent: 67, status: 'yellow', issues: ['Задержка поставок'] },
                { name: 'Танзания-3', ore: 'Золото', plan: 1500, actual: 900, percent: 60, status: 'red', issues: ['Проблемы с вентиляцией'] }
            ],
            phone: '+255XXXXXXXXX'
        },
        'Мозамбик': {
            mines: [
                { name: 'Мозамбик-1', ore: 'Уголь', plan: 3000, actual: 2900, percent: 97, status: 'green', issues: [] },
                { name: 'Мозамбик-2', ore: 'Уголь', plan: 2500, actual: 1800, percent: 72, status: 'yellow', issues: ['Перегрузка'] },
                { name: 'Мозамбик-3', ore: 'Уголь', plan: 2000, actual: 800, percent: 40, status: 'red', issues: ['Авария на шахте', 'Остановка производства'] }
            ],
            phone: '+258XXXXXXXXX'
        }
    };

    // Данные для склада (Снабжение)
    const WAREHOUSE_DATA = {
        'Дизельное топливо': { value: 24500, unit: 'л', critical: 10000 },
        'Взрывчатка': { value: 180, unit: 'кг', critical: 50 },
        'Запчасти (компл.)': { value: 12, unit: 'шт', critical: 5 },
        'Смазочные материалы': { value: 850, unit: 'л', critical: 300 },
        'Инструмент (наборы)': { value: 8, unit: 'шт', critical: 3 }
    };

    // Данные для ремонтов (Механик)
    const REPAIR_DATA = [
        { equipment: 'Экскаватор №3', issue: 'Замена гидронасоса', status: 'В работе', priority: 'high' },
        { equipment: 'Бульдозер №7', issue: 'Ремонт гусеницы', status: 'Ожидание запчастей', priority: 'medium' },
        { equipment: 'Самосвал №12', issue: 'Диагностика двигателя', status: 'Плановый', priority: 'low' },
        { equipment: 'Дробилка №1', issue: 'Замена броней', status: 'Аварийный ремонт', priority: 'high' }
    ];

    // ================================================================
    // 2. ПЕРЕКЛЮЧЕНИЕ РОЛЕЙ
    // ================================================================

    let currentRole = 'ceo';

    function switchRole(role) {
        currentRole = role;
        
        // Обновляем активную кнопку
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`.role-btn.${role}`).classList.add('active');
        
        // Обновляем бейдж
        const roleNames = {
            'ceo': '👑 CEO',
            'mechanic': '🔧 Механик',
            'supply': '📦 Снабжение'
        };
        document.getElementById('roleBadge').textContent = roleNames[role];
        
        // Обновляем контент
        renderDashboard(role);
    }

    // ================================================================
    // 3. РЕНДЕРИНГ ДАШБОРДА
    // ================================================================

    function renderDashboard(role) {
        const container = document.getElementById('dashboardContent');
        let html = '';

        // Показываем/скрываем баннер алертов (только для CEO)
        const alertBanner = document.getElementById('alertBanner');
        if (role === 'ceo') {
            alertBanner.classList.remove('hidden');
        } else {
            alertBanner.classList.add('hidden');
        }

        // ============================================================
        // РЕЖИМ CEO — ВСЁ
        // ============================================================
        if (role === 'ceo') {
            Object.keys(MINING_DATA).forEach(country => {
                const countryData = MINING_DATA[country];
                if (!countryData) return;

                const totalPlan = countryData.mines.reduce((sum, m) => sum + m.plan, 0);
                const totalActual = countryData.mines.reduce((sum, m) => sum + m.actual, 0);
                const totalPercent = totalPlan > 0 ? Math.round((totalActual / totalPlan) * 100) : 0;
                const statusColor = totalPercent >= 90 ? 'green' : totalPercent >= 70 ? 'yellow' : 'red';

                html += `
                    <div class="section">
                        <div class="section-title">
                            <span>🇨🇩 ${country}</span>
                            <span style="font-size: 13px; color: var(--tg-theme-hint-color);">
                                ${countryData.mines.length} рудников
                            </span>
                        </div>
                        <div class="grid">
                            <div class="card card-full">
                                <div class="card-header">
                                    <span class="card-title">📊 Итого по стране</span>
                                    <span class="status-dot status-${statusColor}"></span>
                                </div>
                                <div class="card-stats">
                                    <div class="stat-item">
                                        <div class="stat-value">${totalPlan.toLocaleString()}</div>
                                        <div class="stat-label">План (т/сут)</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-value">${totalActual.toLocaleString()}</div>
                                        <div class="stat-label">Факт (т/сут)</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-value">${totalPercent}%</div>
                                        <div class="stat-label">Выполнение</div>
                                    </div>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill progress-${statusColor}" style="width: ${Math.min(totalPercent, 100)}%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="grid" style="margin-top: 8px;">
                            ${countryData.mines.map(mine => {
                                const statusDot = mine.status || (mine.percent >= 90 ? 'green' : mine.percent >= 70 ? 'yellow' : 'red');
                                return `
                                    <div class="card">
                                        <div class="card-header">
                                            <span class="card-title">${mine.name}</span>
                                            <span class="status-dot status-${statusDot}"></span>
                                        </div>
                                        <div class="card-mine-name">${mine.ore}</div>
                                        <div class="card-stats">
                                            <div class="stat-item">
                                                <div class="stat-value">${mine.plan.toLocaleString()}</div>
                                                <div class="stat-label">План</div>
                                            </div>
                                            <div class="stat-item">
                                                <div class="stat-value">${mine.actual.toLocaleString()}</div>
                                                <div class="stat-label">Факт</div>
                                            </div>
                                            <div class="stat-item">
                                                <div class="stat-value">${mine.percent}%</div>
                                                <div class="stat-label">Вып.</div>
                                            </div>
                                        </div>
                                        <div class="progress-bar">
                                            <div class="progress-fill progress-${statusDot}" style="width: ${Math.min(mine.percent, 100)}%"></div>
                                        </div>
                                        ${mine.issues && mine.issues.length > 0 ? `<div style="margin-top: 6px; font-size: 11px; color: #ef4444;">⚠️ ${mine.issues.join(', ')}</div>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });
        }

        // ============================================================
        // РЕЖИМ МЕХАНИК — ТОЛЬКО РЕМОНТЫ
        // ============================================================
        if (role === 'mechanic') {
            html += `
                <div class="section">
                    <div class="section-title">
                        <span>🔧 Управление ремонтами</span>
                        <span style="font-size: 13px; color: var(--tg-theme-hint-color);">
                            ${REPAIR_DATA.length} активных
                        </span>
                    </div>
                    ${REPAIR_DATA.map(repair => {
                        const priorityColor = repair.priority === 'high' ? 'red' : repair.priority === 'medium' ? 'yellow' : 'green';
                        return `
                            <div class="card" style="border-left: 4px solid ${priorityColor === 'red' ? '#ef4444' : priorityColor === 'yellow' ? '#eab308' : '#22c55e'}; margin-bottom: 8px;">
                                <div class="card-header">
                                    <span class="card-title">🛠️ ${repair.equipment}</span>
                                    <span class="status-dot status-${priorityColor}"></span>
                                </div>
                                <p style="font-size: 14px; color: var(--tg-theme-text-color, #000000);">
                                    ${repair.issue}
                                </p>
                                <p style="font-size: 12px; color: var(--tg-theme-hint-color, #6b7280); margin-top: 4px;">
                                    Статус: ${repair.status}
                                </p>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;

            // Кнопка аварийной остановки (только для механика)
            html += `
                <button class="emergency-btn" onclick="alert('🚨 АВАРИЙНАЯ ОСТАНОВКА ВСЕХ РАБОТ!')">
                    🚨 АВАРИЙНАЯ ОСТАНОВКА
                </button>
            `;
        }

        // ============================================================
        // РЕЖИМ СНАБЖЕНИЕ — ТОЛЬКО СКЛАД
        // ============================================================
        if (role === 'supply') {
            html += `
                <div class="section">
                    <div class="section-title">
                        <span>📦 Остатки склада</span>
                        <span style="font-size: 13px; color: var(--tg-theme-hint-color);">
                            Обновлено: сегодня
                        </span>
                    </div>
                    <div class="card">
                        ${Object.keys(WAREHOUSE_DATA).map(name => {
                            const data = WAREHOUSE_DATA[name];
                            const isLow = data.value < data.critical;
                            return `
                                <div class="warehouse-item">
                                    <span class="warehouse-name">${name}</span>
                                    <span class="warehouse-value ${isLow ? 'low' : ''}">
                                        ${data.value.toLocaleString()} ${data.unit}
                                        ${isLow ? ' ⚠️' : ''}
                                    </span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            // Дополнительная информация для снабжения
            html += `
                <div class="section">
                    <div class="section-title">
                        <span>📊 Критические запасы</span>
                    </div>
                    <div class="card">
                        ${Object.keys(WAREHOUSE_DATA).filter(name => WAREHOUSE_DATA[name].value < WAREHOUSE_DATA[name].critical).map(name => {
                            const data = WAREHOUSE_DATA[name];
                            return `
                                <div class="warehouse-item" style="color: #ef4444;">
                                    <span class="warehouse-name">⚠️ ${name}</span>
                                    <span class="warehouse-value low">
                                        ${data.value.toLocaleString()} ${data.unit}
                                    </span>
                                </div>
                            `;
                        }).join('') || '<p style="color: #22c55e;">✅ Все запасы в норме</p>'}
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;

        // Настраиваем кнопки действий
        setupActionButtons(role);
    }

    // ================================================================
    // 4. НАСТРОЙКА КНОПОК
    // ================================================================

    function setupActionButtons(role) {
        const callBtn = document.getElementById('callBtn');

        if (role === 'ceo') {
            callBtn.textContent = '📞 Связаться с директорами';
            callBtn.onclick = () => alert('📞 Звонок директорам стран');
        } else if (role === 'mechanic') {
            callBtn.textContent = '📞 Вызвать ремонтную бригаду';
            callBtn.onclick = () => alert('📞 Ремонтная бригада вызвана!');
        } else if (role === 'supply') {
            callBtn.textContent = '📞 Связаться со снабжением';
            callBtn.onclick = () => alert('📞 Запрос на пополнение склада отправлен!');
        }

        // Кнопка PDF
        document.getElementById('pdfBtn').onclick = () => {
            window.print();
        };
    }

    // ================================================================
    // 5. ЗАПУСК
    // ================================================================

    function init() {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
        }
        
        // По умолчанию — режим CEO
        switchRole('ceo');
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
